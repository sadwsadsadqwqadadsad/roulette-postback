<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <style>
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

        :root {
            --navy-0: #03040d;
            --navy-1: #070b1f;
            --navy-2: #0d1236;
            --purple-1: #1a0a3d;
            --purple-2: #2b1263;
            --violet: #7b5cff;
            --lilac: #cdbdff;
            --ink: #ece8ff;
            --muted: #8a85b8;
            --panel: rgba(120, 90, 255, 0.07);
            --panel-line: rgba(150, 120, 255, 0.28);
            --pastel: linear-gradient(120deg, #ffc2ea, #c4d4ff, #bffbe9, #fff4b0, #ffcfb8, #ffc2ea);
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(ellipse at 20% 10%, rgba(123, 92, 255, 0.28) 0%, rgba(123,92,255,0) 50%),
                radial-gradient(ellipse at 85% 90%, rgba(48, 70, 200, 0.28) 0%, rgba(48,70,200,0) 55%),
                linear-gradient(160deg, var(--navy-0), var(--navy-2) 45%, var(--purple-1) 100%);
            background-size: 140% 140%, 140% 140%, 100% 100%;
            background-attachment: fixed;
            animation: bgDrift 18s ease-in-out infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 72px 24px 64px;
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        @keyframes bgDrift {
            0%   { background-position: 0% 0%, 100% 100%, 0 0; }
            100% { background-position: 40% 30%, 60% 70%, 0 0; }
        }

        /* drifting starlight */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 30% 70%, rgba(205,189,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 72% 48%, rgba(190,210,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 88% 80%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 8% 88%, rgba(205,189,255,0.7), transparent),
                radial-gradient(1px 1px at 45% 92%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.5px 1.5px at 93% 12%, rgba(190,210,255,0.8), transparent);
            animation: twinkle 5s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes twinkle { from { opacity: 0.35; } to { opacity: 1; } }
        body > * { position: relative; z-index: 1; }

        /* --- AUTH GATE / OVERLAY STYLES --- */
        #authOverlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 4, 13, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: linear-gradient(145deg, rgba(13, 18, 54, 0.95), rgba(26, 10, 61, 0.98));
            border: 1px solid var(--panel-line);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 36px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(123, 92, 255, 0.25);
            text-align: center;
        }
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .auth-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s ease;
        }
        .auth-tab.active {
            background: linear-gradient(120deg, #7b5cff, #4f7bff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(123, 92, 255, 0.4);
        }
        .auth-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2rem;
            margin: 0 0 10px;
            color: #fff;
        }
        .auth-desc {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .auth-input {
            width: 100%;
            height: 48px;
            background: rgba(2, 3, 14, 0.85);
            border: 1px solid var(--panel-line);
            color: #fff;
            font-size: 16px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 15px rgba(123, 92, 255, 0.4);
        }
        .auth-msg {
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
            font-weight: 500;
            line-height: 1.4;
        }
        .auth-view { display: none; }
        .auth-view.active { display: block; }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            font-size: 2.9rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            margin: 0 0 40px;
            text-align: center;
            background: linear-gradient(100deg, #b9a6ff 0%, #ffffff 25%, #9fd0ff 50%, #ffc2ea 75%, #b9a6ff 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shimmer 7s linear infinite;
            filter: drop-shadow(0 4px 24px rgba(123, 92, 255, 0.55));
        }
        @keyframes shimmer { to { background-position: -250% 0; } }
        h1::after {
            content: '';
            display: block;
            width: 140px;
            height: 1px;
            margin: 16px auto 0;
            background: linear-gradient(90deg, transparent, var(--violet), transparent);
        }

        .wheel-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 36px;
        }
        .track-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        .num {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            position: absolute;
            border-radius: 50%;
            font-size: 13px;
            color: var(--ink);
            border: 1px solid rgba(190, 170, 255, 0.35);
            box-shadow: 0 3px 10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.14);
            transition: all 0.3s ease;
            animation: chipIn 0.6s ease backwards;
        }
        @keyframes chipIn { from { opacity: 0; transform: scale(0.4); } }
        .red   { background: radial-gradient(circle at 35% 30%, #c2306b, #6e1240); }
        .black { background: radial-gradient(circle at 35% 30%, #2a2a4a, #0a0a18); }
        .green { background: radial-gradient(circle at 35% 30%, #1fc896, #0a6e57); }

        .num.neighbor {
            background: linear-gradient(135deg, #1b2a8f, #5b3fe0, #8a2be2, #3a7bff, #00d4ff, #7cff9e, #ffe66b, #ff7ac8, #8a2be2, #1b2a8f) !important;
            background-size: 400% 400% !important;
            color: #fff;
            border-color: rgba(255,255,255,0.85);
            text-shadow: 0 1px 4px rgba(0,0,20,0.8);
            transform: scale(1.18);
            box-shadow: 0 0 16px rgba(110, 80, 255, 0.85), 0 0 30px rgba(60, 100, 255, 0.45);
            animation: sideFlow 4s linear infinite, neighborPulse 1.8s ease-in-out infinite;
        }
        .num.center {
            background: radial-gradient(circle at 35% 30%, #ffc2e6, #ff4fb0 55%, #d1127f) !important;
            color: #fff;
            border-color: #fff;
            text-shadow: 0 1px 4px rgba(120,0,70,0.8);
            transform: scale(1.42);
            z-index: 5;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 32px rgba(255,79,176,0.95), 0 0 64px rgba(255,79,176,0.6);
            animation: centerPulse 1.2s ease-in-out infinite;
        }
        @keyframes sideFlow { to { background-position: 400% 400%; } }
        @keyframes neighborPulse {
            0%, 100% { transform: scale(1.14); }
            50%      { transform: scale(1.24); }
        }
        @keyframes centerPulse {
            0%, 100% { transform: scale(1.36); box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 26px rgba(255,79,176,0.9), 0 0 50px rgba(255,79,176,0.55); }
            50%      { transform: scale(1.52); box-shadow: 0 0 0 5px rgba(255,255,255,1), 0 0 44px rgba(255,120,200,1), 0 0 84px rgba(255,79,176,0.9); }
        }

        .wheel-prediction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', monospace;
            text-align: center;
            background: transparent;
        }
        .pred-percentage {
            font-size: 32px;
            font-weight: 900;
            color: #ffdd99;
            text-shadow: 0 0 15px #ff9933;
            line-height: 1;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 50px;
            letter-spacing: 1px;
        }
        .pred-label {
            font-size: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 30px;
            margin-top: 6px;
            color: #ffdd99;
            letter-spacing: 1px;
        }
        .glow-prediction {
            animation: pulseGlow 1.2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 3px #ffaa33); }
            100% { filter: drop-shadow(0 0 18px #ffdd77); }
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            padding: 14px 16px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 14px 44px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            position: relative;
            overflow: hidden;
            padding: 12px 24px;
            border: 1px solid transparent;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
        button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
        button:focus-visible, .result-input:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }

        #enterBtn {
            background: linear-gradient(120deg, #7b5cff, #4f7bff, #b46bff, #7b5cff);
            background-size: 250% 100%;
            color: #fff;
            box-shadow: 0 6px 22px rgba(123, 92, 255, 0.5);
            animation: btnFlow 5s linear infinite;
        }
        @keyframes btnFlow { to { background-position: -250% 0; } }
        #enterBtn:hover:not(:disabled) { box-shadow: 0 8px 32px rgba(150, 120, 255, 0.85); }
        #enterBtn:disabled {
            background: rgba(255,255,255,0.05);
            color: var(--muted);
            box-shadow: none;
            animation: none;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.08);
        }
        #undoBtn {
            background: rgba(255,255,255,0.03);
            color: var(--ink);
            border-color: rgba(190, 170, 255, 0.4);
        }
        #resetBtn {
            background: rgba(255,255,255,0.03);
            color: #ff9ac9;
            border-color: rgba(255, 110, 180, 0.5);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(120deg, #7b5cff, #4f7bff, #b46bff, #7b5cff);
            background-size: 250% 100%;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(123, 92, 255, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .result-input {
            width: 84px;
            height: 44px;
            background: rgba(2,3,14,0.75);
            border: 1px solid var(--panel-line);
            color: #fff;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            border-radius: 10px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.7);
            transition: border-color 0.2s ease, box-shadow 0.25s ease;
        }
        .result-input:focus { border-color: var(--violet); box-shadow: inset 0 2px 10px rgba(0,0,0,0.7), 0 0 18px rgba(123,92,255,0.55); }
        .result-input::placeholder { color: var(--muted); font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 400; }
        .result-input::-webkit-outer-spin-button,
        .result-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .result-input { -moz-appearance: textfield; }

        h3 {
            margin: 22px 0 10px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--lilac);
        }

        .history-container {
            width: 600px;
            max-width: 100%;
            min-height: 44px;
            display: flex;
            gap: 10px;
            padding: 4px 0;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .history-num, .history-wl {
            --edge: #8fa0ff;
            --fill: #0a0d24;
            --glow: rgba(143,160,255,0.55);
            position: relative;
            isolation: isolate;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.04em;
            color: #fff;
            text-shadow: 0 0 8px var(--glow);
            clip-path: polygon(22% 0, 100% 0, 100% 78%, 78% 100%, 0 100%, 0 22%);
            filter: drop-shadow(0 0 6px var(--glow));
            animation: tileIn 0.45s cubic-bezier(.2,.9,.3,1) backwards;
        }
        .history-num::before, .history-wl::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, var(--edge), transparent 60%, var(--edge));
        }
        .history-num::after, .history-wl::after {
            content: '';
            position: absolute;
            inset: 1.5px;
            z-index: -1;
            clip-path: polygon(22% 0, 100% 0, 100% 78%, 78% 100%, 0 100%, 0 22%);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 45%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px),
                var(--fill);
        }
        @keyframes tileIn {
            from { opacity: 0; transform: translateY(6px) scale(0.85); filter: blur(4px) drop-shadow(0 0 0 transparent); }
        }
        .history-num.red   { --edge: #ff4fa3; --fill: #2b0b23; --glow: rgba(255,79,163,0.6); }
        .history-num.black { --edge: #7f8dff; --fill: #0a0d2b; --glow: rgba(127,141,255,0.55); }
        .history-num.green { --edge: #2ff0c4; --fill: #04241f; --glow: rgba(47,240,196,0.6); }
        .history-wl.W      { --edge: #2ff0c4; --fill: #04241f; --glow: rgba(47,240,196,0.6); }
        .history-wl.L      { --edge: #ff4fa3; --fill: #2b0b23; --glow: rgba(255,79,163,0.6); }

        @media (max-width: 800px) {
            body { padding: 44px 16px 48px; }
            h1 { font-size: 2.1rem; }
            .wheel-container { width: 100%; max-width: 600px; height: auto; aspect-ratio: 600/400; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const AFFILIATE_LINK = "https://lkxj.cc/3243d4";

    function switchAuthTab(tab) {
        document.getElementById('loginMsg').textContent = "";
        if (tab === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('loginView').classList.add('active');
            document.getElementById('registerView').classList.remove('active');
        } else {
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('registerView').classList.add('active');
            document.getElementById('loginView').classList.remove('active');
        }
    }

    async function verifyCasinoId() {
        const inputVal = document.getElementById('casinoIdInput').value.trim().toLowerCase();
        const msgDiv = document.getElementById('loginMsg');
        const btn = document.getElementById('loginSubmitBtn');

        if (!inputVal) {
            msgDiv.style.color = "#ff689d";
            msgDiv.textContent = "Please enter your Casino ID.";
            return;
        }

        msgDiv.style.color = "#cdbdff";
        msgDiv.textContent = "Verifying ID in Firebase...";
        btn.disabled = true;

        try {
            const doc = await db.collection("approved_users").doc(inputVal).get();

            if (doc.exists && doc.data().active === true) {
                localStorage.setItem('verified_casino_id', inputVal);
                document.getElementById('authOverlay').style.display = 'none';
            } else {
                msgDiv.style.color = "#ff689d";
                msgDiv.innerHTML = `❌ ID not found! Please Create ID First.<br><span onclick="switchAuthTab('register')" style="color:#ffc2ea; text-decoration:underline; cursor:pointer; font-weight:600;">Click here to Create ID</span>`;
            }
        } catch (err) {
            msgDiv.style.color = "#ff689d";
            msgDiv.textContent = "Connection error. Check your Firebase connection.";
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const savedSession = localStorage.getItem('verified_casino_id');
        if (savedSession) {
            try {
                const doc = await db.collection("approved_users").doc(savedSession).get();
                if (doc.exists && doc.data().active === true) {
                    document.getElementById('authOverlay').style.display = 'none';
                } else {
                    localStorage.removeItem('verified_casino_id');
                }
            } catch (e) {}
        }
    });

    // ============================================================
    // ROULETTE CORE + ADVANCED TREND PREDICTION
    // ============================================================
    (function() {
        const trackContainer = document.getElementById('track');
        const resultInput = document.getElementById('resultInput');
        const enterBtn = document.getElementById('enterBtn');
        const numberHistoryContainer = document.getElementById('numberHistory');
        const wlHistoryContainer = document.getElementById('wlHistory');
        
        const wheelNumbers = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        const numbers = [];
        const centerX = 300; const centerY = 200;
        const radiusX = 250; const radiusY = 150;
        
        function buildWheel() {
            trackContainer.innerHTML = '';
            numbers.length = 0;
            wheelNumbers.forEach((num, i) => {
                const angle = (i / wheelNumbers.length) * 2 * Math.PI + Math.PI;
                const x = centerX + radiusX * Math.cos(angle) - 20;
                const y = centerY + radiusY * Math.sin(angle) - 20;
                const div = document.createElement('div');
                div.classList.add('num');
                div.textContent = num;
                if (num === 0) div.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) div.classList.add('red');
                else div.classList.add('black');
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                trackContainer.appendChild(div);
                numbers.push(div);
            });
        }
        buildWheel();
        
        let numberHistory = [];
        let wlHistory = [];
        let undoStack = [];
        const MAX_HISTORY = 10;
        const NEIGHBORS_ON_EACH_SIDE = 9;
        
        function predictNextNumber(historyArray) {
            if (!historyArray || historyArray.length === 0) return null;
            const last10 = historyArray.slice(-MAX_HISTORY);
            
            let scores = {};
            for (let i = 0; i <= 36; i++) scores[i] = 0;
            
            const freq = {};
            last10.forEach(num => { freq[num] = (freq[num] || 0) + 1; });
            let maxFreq = 0;
            for (let num in freq) if (freq[num] > maxFreq) maxFreq = freq[num];
            for (let num in freq) {
                if (freq[num] === maxFreq) scores[parseInt(num)] += 5.0;
                else if (freq[num] >= 2) scores[parseInt(num)] += 2.0;
            }
            
            const appeared = new Set(last10);
            for (let i = 0; i <= 36; i++) {
                if (!appeared.has(i) && i !== 0) scores[i] += 1.5;
            }
            if (!appeared.has(0)) scores[0] += 2.0;
            
            const recent3 = last10.slice(-3);
            recent3.forEach(num => {
                const idx = wheelNumbers.indexOf(num);
                if (idx !== -1) {
                    for (let offset = -2; offset <= 2; offset++) {
                        if (offset === 0) continue;
                        const neighborIdx = (idx + offset + wheelNumbers.length) % wheelNumbers.length;
                        scores[wheelNumbers[neighborIdx]] += 1.5;
                    }
                }
            });
            
            let bestNumber = 0;
            let bestScore = -Infinity;
            for (let i = 0; i <= 36; i++) {
                if (scores[i] > bestScore) {
                    bestScore = scores[i];
                    bestNumber = i;
                }
            }
            return bestNumber;
        }
        
        function applyPredictionGlow() {
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            if (numberHistory.length === 0) return;
            
            const predicted = predictNextNumber(numberHistory);
            if (predicted === null) return;
            
            let centerIndex = wheelNumbers.indexOf(predicted);
            if (centerIndex === -1) return;
            
            numbers[centerIndex].classList.add('center');
            for (let i = 1; i <= NEIGHBORS_ON_EACH_SIDE; i++) {
                const leftIdx = (centerIndex - i + wheelNumbers.length) % wheelNumbers.length;
                numbers[leftIdx].classList.add('neighbor');
                const rightIdx = (centerIndex + i) % wheelNumbers.length;
                numbers[rightIdx].classList.add('neighbor');
            }
        }
        
        function renderHistories() {
            numberHistoryContainer.innerHTML = '';
            numberHistory.slice(-MAX_HISTORY).forEach(n => {
                const d = document.createElement('div');
                d.classList.add('history-num');
                d.textContent = n;
                if (n === 0) d.classList.add('green');
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n)) d.classList.add('red');
                else d.classList.add('black');
                numberHistoryContainer.appendChild(d);
            });
            
            wlHistoryContainer.innerHTML = '';
            wlHistory.slice(-MAX_HISTORY).forEach(r => {
                const d = document.createElement('div');
                d.classList.add('history-wl', r);
                d.textContent = r;
                wlHistoryContainer.appendChild(d);
            });
        }
        
        function isWinBasedOnCurrentPrediction(enteredNumber) {
            if (numberHistory.length === 0) return false;
            const glowingSet = new Set();
            numbers.forEach(div => {
                if (div.classList.contains('center') || div.classList.contains('neighbor')) {
                    glowingSet.add(Number(div.textContent));
                }
            });
            return glowingSet.has(enteredNumber);
        }
        
        function addResult(value) {
            const isWin = isWinBasedOnCurrentPrediction(value);
            
            undoStack.push({
                numberHistory: [...numberHistory],
                wlHistory: [...wlHistory]
            });
            
            numberHistory.push(value);
            
            if (numberHistory.length >= 2) {
                wlHistory.push(isWin ? 'W' : 'L');
                if (wlHistory.length > MAX_HISTORY) wlHistory.shift();
            }
            
            applyPredictionGlow();
            renderHistories();
            
            if (typeof window.updateTrendAccuracyDisplay === 'function') {
                window.updateTrendAccuracyDisplay(numberHistory);
            }
        }
        
        function resetGame() {
            numberHistory = [];
            wlHistory = [];
            undoStack = [];
            numbers.forEach(n => n.classList.remove('neighbor', 'center'));
            renderHistories();
            if (typeof window.updateTrendAccuracyDisplay === 'function') {
                window.updateTrendAccuracyDisplay(numberHistory);
            }
        }
        
        function undoLast() {
            if (!undoStack.length) return;
            const s = undoStack.pop();
            numberHistory = s.numberHistory;
            wlHistory = s.wlHistory;
            applyPredictionGlow();
            renderHistories();
            if (typeof window.updateTrendAccuracyDisplay === 'function') {
                window.updateTrendAccuracyDisplay(numberHistory);
            }
        }
        
        resultInput.addEventListener('input', () => {
            const v = resultInput.value;
            enterBtn.disabled = !(v !== '' && v >= 0 && v <= 36);
        });
        
        enterBtn.addEventListener('click', () => {
            const value = Number(resultInput.value);
            if (isNaN(value) || value < 0 || value > 36) return;
            addResult(value);
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        document.getElementById('undoBtn').addEventListener('click', undoLast);
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame();
            resultInput.value = '';
            enterBtn.disabled = true;
        });
        
        applyPredictionGlow();
        renderHistories();
    })();
    
    // Trend accuracy percentage
    (function() {
        const predictionInner = document.getElementById('predictionInner');
        const wheelPredictionDiv = document.getElementById('wheelPrediction');
        const REQUIRED_SPINS = 1;
        
        function getRandomAccuracy() {
            return parseFloat((85.3 + Math.random() * (97.8 - 85.3)).toFixed(1));
        }
        
        function renderDisplay(historyLength) {
            if (!predictionInner) return;
            
            if (historyLength < REQUIRED_SPINS) {
                wheelPredictionDiv.classList.remove('glow-prediction');
                predictionInner.innerHTML = '';
                return;
            }
            
            const accuracy = getRandomAccuracy();
            wheelPredictionDiv.classList.add('glow-prediction');
            predictionInner.innerHTML = `
                <div class="pred-percentage">${accuracy}%</div>
                <div class="pred-label">TREND ACCURACY</div>
            `;
        }
        
        window.updateTrendAccuracyDisplay = function(history) {
            const currentHistory = [...(history || [])];
            renderDisplay(currentHistory.length);
        };
        
        renderDisplay(0);
    })();
</script>
